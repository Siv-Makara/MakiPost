appId: app.makipost.client
productName: MakiPost
copyright: "Copyright © 2026 makarasiv058@gmail.com"
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack: []
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # No version in the file names, so .../releases/latest/download/MakiPost-Setup.exe
  # is a permanent one-click link to the newest version.
  artifactName: ${productName}-Setup.${ext}
portable:
  artifactName: ${productName}-Portable.${ext}
# Where `npm run release` uploads builds, and where installed copies look for updates.
publish:
  provider: github
  owner: Siv-Makara
  repo: MakiPost
  releaseType: draft
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: makarasiv058@gmail.com
