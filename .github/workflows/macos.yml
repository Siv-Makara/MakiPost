# Builds the macOS app on GitHub's Mac runners and attaches MakiPost-mac.dmg to the release.
# Runs when a version tag (v0.7.3, …) is pushed, or by hand from the Actions tab for an
# existing tag. The Windows files are built and uploaded from a Windows PC (npm run release).
name: macOS build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v0.7.3'
        required: true

permissions:
  contents: write # upload to releases

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The lockfile is made on Windows; fall back to install if a macOS-only optional
      # package (e.g. Rollup's native binary) isn't listed in it.
      - name: Install
        run: npm ci || npm install --no-audit --no-fund

      - name: Build app
        run: npx electron-vite build

      - name: Package universal .dmg
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no Apple certificate: ad-hoc signature only

      - name: Upload to the release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "MakiPost $TAG" --notes "Built by GitHub Actions."
          fi
          gh release upload "$TAG" dist/MakiPost-mac.dmg --clobber
